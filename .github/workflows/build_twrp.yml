name: Build TWRP for Piano

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Main
        uses: actions/checkout@v4

      - name: Free Up Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y repo git curl wget

      - name: Init AOSP-TWRP Manifest & Sync Source
        run: |
          mkdir workspace && cd workspace
          repo init -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git -b twrp-12.1 --depth=1
          repo sync -j$(nproc --all) --force-sync

      - name: Clone and Place Device Tree
        run: |
          cd workspace
          # 1. 克隆到临时目录
          git clone https://github.com/BrotherFPV/android_device_xiaomi_piano.git temp_tree
          
          # 2. 创建源码中的目标设备树目录
          mkdir -p device/xiaomi/piano
          
          # 3. 将仓库中嵌套的 xiaomi/piano 下的所有文件复制到源码目标位置
          cp -r temp_tree/xiaomi/piano/* device/xiaomi/piano/
          
          # 4. 清理临时目录
          rm -rf temp_tree

      - name: Start Building TWRP
        run: |
          cd workspace
          export ALLOW_MISSING_DEPENDENCIES=true
          source build/envsetup.sh
          lunch omni_piano-eng
          mka recoveryimage

      - name: Traverse and List All Output Files
        if: always() # 确保即使编译失败或没有生成文件也会执行这步
        run: |
          echo "=== 1. 检查 workspace/out 目录是否存在 ==="
          if [ -d "workspace/out" ]; then
          echo "out 目录存在，开始全局搜索所有的 .img 文件："
          find workspace/out -name "*.img"
          
          echo "=== 2. 递归打印 out 目录下的所有文件结构（限深3层） ==="
          find workspace/out -maxdepth 3 -print
          else
          echo "错误：workspace/out 目录根本不存在！说明编译过程没有产出任何内容。"
          fi
        
          echo "=== 3. 检查设备树是否正确克隆到了源码中 ==="
          ls -la workspace/device/xiaomi/ || echo "xiaomi 目录不存在"


      - name: Find All Generated Images
        run: |
          echo "=== 正在全局搜索所有的 .img 文件 ==="
          find workspace/out -name "*.img"
        
          echo "=== 检查设备树目录是否被正确识别 ==="
          ls -l workspace/device/xiaomi/


      
      - name: Copy and Organize Images to Repository Root
        run: |
          # 1. 在当前仓库根目录下创建一个存放编译结果的文件夹
          mkdir -p built_images/piano
        
          # 2. 把编译出来的关键镜像复制过去（如果找不到recovery就找找看有没有其他img）
          cp -fv workspace/out/target/product/piano/recovery.img built_images/piano/ 2>/dev/null || true
          cp -fv workspace/out/target/product/piano/boot.img built_images/piano/ 2>/dev/null || true
          cp -fv workspace/out/target/product/piano/*.img built_images/piano/ 2>/dev/null || true
        
          # 3. 打印复制结果，确认里面有文件
          ls -l built_images/piano/

      - name: Commit and Push Built Images Back to Repository
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🤖 Auto-upload built recovery images for piano"
          branch: main
          file_pattern: "built_images/*"
