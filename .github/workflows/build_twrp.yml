name: Build TWRP for Piano

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Main
        uses: actions/checkout@v4

      - name: Free Up Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y repo git curl wget

      - name: Init AOSP-TWRP Manifest & Sync Source
        run: |
          mkdir workspace && cd workspace
          repo init -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git -b twrp-12.1 --depth=1
          repo sync -j$(nproc --all) --force-sync

      - name: Clone and Place Device Tree
        run: |
          cd workspace
          # 1. 克隆到临时目录
          git clone https://github.com/BrotherFPV/android_device_xiaomi_piano.git temp_tree
          
          # 2. 创建源码中的目标设备树目录
          mkdir -p device/xiaomi/piano
          
          # 3. 将仓库中嵌套的 xiaomi/piano 下的所有文件复制到源码目标位置
          cp -r temp_tree/xiaomi/piano/* device/xiaomi/piano/
          
          # 4. 清理临时目录
          rm -rf temp_tree

      - name: Start Building TWRP
        run: |
          cd workspace
          export ALLOW_MISSING_DEPENDENCIES=true
          source build/envsetup.sh
          lunch twrp_piano-eng || lunch omni_piano-eng
          mka recoveryimage

      - name: Upload Recovery Image
        uses: actions/upload-artifact@v4
        with:
          name: recovery-piano
          path: workspace/out/target/product/piano/recovery.img
