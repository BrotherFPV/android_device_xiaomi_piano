name: Build TWRP for Piano

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Main
        uses: actions/checkout@v4

      - name: Free Up Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true

      # 增加 12GB Swap 虚拟内存，防止 C++ 编译/链接阶段 OOM 崩溃
      - name: Set up Swap Space
        run: |
          sudo swapoff -a
          sudo rm -f /swapfile
          sudo fallocate -l 12G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            repo git curl wget build-essential ccache zip \
            libssl-dev libgl1-mesa-dev python3 python-is-python3

      - name: Init AOSP-TWRP Manifest & Sync Source
        run: |
          mkdir workspace && cd workspace
          repo init -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git -b twrp-12.1 --depth=1
          repo sync -j$(nproc --all) --force-sync

      - name: Clone and Place Device Tree
        run: |
          cd workspace
          # 1. 克隆到临时目录
          git clone https://github.com/BrotherFPV/android_device_xiaomi_piano.git temp_tree
          
          # 2. 创建源码中的目标设备树目录
          mkdir -p device/xiaomi/piano
          
          # 3. 将仓库中嵌套的 xiaomi/piano 下的所有文件复制到源码目标位置
          cp -r temp_tree/xiaomi/piano/* device/xiaomi/piano/
          
          # 4. 清理临时目录
          rm -rf temp_tree

      - name: Start Building TWRP Recovery
        run: |
          cd workspace
          export ALLOW_MISSING_DEPENDENCIES=true
          source build/envsetup.sh
          lunch omni_piano-eng
          # 限制编译并行数为 2~4，搭配 12G Swap 避免 OOM 崩溃
          mka recoveryimage -j2

      - name: Traverse and List All Output Files
        if: always()
        run: |
          echo "=== 1. 检查 workspace/out 目录是否存在 ==="
          if [ -d "workspace/out" ]; then
            echo "out 目录存在，开始全局搜索所有的 .img 文件："
            find workspace/out -name "*.img"
            
            echo "=== 2. 检查产物目录下的镜像 ==="
            ls -la workspace/out/target/product/piano/ || echo "产物目录不存在"
          else
            echo "错误：workspace/out 目录不存在！说明编译过程未产生输出。"
          fi
        
          echo "=== 3. 检查设备树是否正确放置 ==="
          ls -la workspace/device/xiaomi/piano/ || echo "device/xiaomi/piano 目录不存在"

      - name: Copy and Organize Images to Repository Root
        run: |
          # 创建产物保存目录
          mkdir -p built_images/piano
        
          # 复制 recovery.img 及其他生成的镜像产物
          if [ -d "workspace/out/target/product/piano" ]; then
            cp -fv workspace/out/target/product/piano/recovery.img built_images/piano/ 2>/dev/null || true
            cp -fv workspace/out/target/product/piano/*.img built_images/piano/ 2>/dev/null || true
          fi
        
          # 打印结果
          ls -la built_images/piano/

      - name: Commit and Push Built Images Back to Repository
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🤖 Auto-upload built recovery images for piano"
          branch: main
          file_pattern: "built_images/*"

